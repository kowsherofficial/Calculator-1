<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculator</title>
<style>
:root{--bg:#e9ece6;--body:#1f3a34;--screen:#d4e0c4;--ink:#16261f;--key:#f4f5f0;--keyink:#1f3a34;--op:#e0a43a;--opink:#2a1d05;--clr:#c8553d;--clrink:#fff;--eq:#2f7d6b;--eqink:#fff;--hist:#5d7a6f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1815;--body:#16261f;--screen:#b9c9a6;--key:#24382f;--keyink:#e8efe6;--hist:#8fa79b}}
:root[data-theme="dark"]{--bg:#0f1815;--body:#16261f;--screen:#b9c9a6;--key:#24382f;--keyink:#e8efe6;--hist:#8fa79b}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);display:flex;align-items:center;justify-content:center;font-family:"Segoe UI",system-ui,sans-serif;padding:16px}
.calc{width:100%;max-width:340px;background:var(--body);border-radius:24px;padding:18px;box-shadow:0 18px 40px rgba(0,0,0,.25)}
.screen{background:var(--screen);color:var(--ink);border-radius:12px;padding:12px 14px;text-align:right;min-height:96px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;box-shadow:inset 0 2px 6px rgba(0,0,0,.25)}
.hist{font-size:14px;color:var(--hist);min-height:20px;word-break:break-all;font-family:"Courier New",monospace}
.out{font-size:42px;font-weight:600;font-family:"Courier New",monospace;line-height:1.1;white-space:nowrap;overflow-x:auto}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
button{font:inherit;font-size:22px;font-weight:600;border:0;border-radius:14px;height:60px;cursor:pointer;background:var(--key);color:var(--keyink);box-shadow:0 3px 0 rgba(0,0,0,.28);transition:transform .08s,box-shadow .08s}
button:active{transform:translateY(3px);box-shadow:0 0 0 rgba(0,0,0,.28)}
button:focus-visible{outline:3px solid var(--op);outline-offset:2px}
.op{background:var(--op);color:var(--opink)}
.clr{background:var(--clr);color:var(--clrink)}
.eq{background:var(--eq);color:var(--eqink);grid-row:span 2;height:auto}
.zero{grid-column:span 2}
</style>
</head>
<body>
<div class="calc" role="application" aria-label="Calculator">
  <div class="screen"><div class="hist" id="hist"></div><div class="out" id="out" aria-live="polite">0</div></div>
  <div class="keys" id="keys">
    <button class="clr" data-a="clear">AC</button>
    <button class="op" data-a="back" aria-label="Backspace">⌫</button>
    <button class="op" data-a="percent">%</button>
    <button class="op" data-a="op" data-v="/">÷</button>
    <button data-a="num" data-v="7">7</button><button data-a="num" data-v="8">8</button><button data-a="num" data-v="9">9</button>
    <button class="op" data-a="op" data-v="*">×</button>
    <button data-a="num" data-v="4">4</button><button data-a="num" data-v="5">5</button><button data-a="num" data-v="6">6</button>
    <button class="op" data-a="op" data-v="-">−</button>
    <button data-a="num" data-v="1">1</button><button data-a="num" data-v="2">2</button><button data-a="num" data-v="3">3</button>
    <button class="op" data-a="op" data-v="+">+</button>
    <button class="zero" data-a="num" data-v="0">0</button>
    <button data-a="dot">.</button>
    <button class="eq" data-a="eq">=</button>
  </div>
</div>
<script>
(function(){
  var cur="0",prev=null,op=null,fresh=false,hist="";
  var out=document.getElementById("out"),h=document.getElementById("hist");
  var sym={"/":"÷","*":"×","-":"−","+":"+"};
  function fmt(s){
    if(s==="Error")return s;
    var n=parseFloat(s);
    if(!isFinite(n))return "Error";
    if(/\.$/.test(s)||/\.\d*0$/.test(s)&&s.indexOf("e")<0)return s;
    if(Math.abs(n)>=1e12||(n!==0&&Math.abs(n)<1e-9))return n.toExponential(6);
    return String(+n.toPrecision(12));
  }
  function render(){out.textContent=fmt(cur);h.textContent=hist;}
  function calc(a,b,o){
    a=parseFloat(a);b=parseFloat(b);
    if(o==="+")return a+b;if(o==="-")return a-b;if(o==="*")return a*b;
    if(o==="/")return b===0?NaN:a/b;return b;
  }
  function num(d){
    if(cur==="Error"||fresh){cur="0";fresh=false;}
    if(cur==="0")cur=d;else if(cur.replace(/[-.]/g,"").length<12)cur+=d;
  }
  function chain(){
    if(op!==null&&prev!==null&&!fresh){
      var r=calc(prev,cur,op);
      cur=isFinite(r)?String(+r.toPrecision(12)):"Error";
    }
  }
  function act(a,v){
    if(cur==="Error"&&a!=="clear"&&a!=="num"&&a!=="dot")return;
    if(a==="num")num(v);
    else if(a==="dot"){if(cur==="Error"||fresh){cur="0";fresh=false;}if(cur.indexOf(".")<0)cur+=".";}
    else if(a==="clear"){cur="0";prev=null;op=null;fresh=false;hist="";}
    else if(a==="back"){if(fresh)return;cur=cur.length>1&&cur!=="Error"?cur.slice(0,-1):"0";if(cur==="-")cur="0";}
    else if(a==="percent"){cur=String(+(parseFloat(cur)/100).toPrecision(12));}
    else if(a==="op"){
      chain();
      if(cur==="Error"){prev=null;op=null;hist="";}
      else{prev=cur;op=v;fresh=true;hist=fmt(cur)+" "+sym[v];}
    }
    else if(a==="eq"){
      if(op===null)return;
      var left=fmt(prev),right=fmt(cur),o=op;
      var r=calc(prev,cur,op);
      cur=isFinite(r)?String(+r.toPrecision(12)):"Error";
      hist=left+" "+sym[o]+" "+right+" =";
      prev=null;op=null;fresh=true;
    }
    render();
  }
  document.getElementById("keys").addEventListener("click",function(e){
    var b=e.target.closest("button");if(!b)return;
    act(b.dataset.a,b.dataset.v);
  });
  document.addEventListener("keydown",function(e){
    var k=e.key;
    if(/^\d$/.test(k))act("num",k);
    else if(k===".")act("dot");
    else if("+-*/".indexOf(k)>=0){e.preventDefault();act("op",k);}
    else if(k==="Enter"||k==="="){e.preventDefault();act("eq");}
    else if(k==="Backspace")act("back");
    else if(k==="Escape"||k==="Delete")act("clear");
    else if(k==="%")act("percent");
  });
  render();
})();
</script>
</body>
</html>
